name: Get Unity License File
on: [push]

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activation file (.alf)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            unityci/editor:ubuntu-2022.3.40f1-base-3 \
            unity-editor -batchmode -nographics -logFile /dev/stdout -quit -createManualActivationFile || true

      - name: Upload ALF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.40f1.alf
          path: "*.alf"
